<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" role="img" aria-label="An open guideline book with a pulse line, a medicine capsule, and a completion check mark">
  <defs>
    <clipPath id="pillClip">
      <rect x="-14" y="-40" width="28" height="80" rx="14" />
    </clipPath>
  </defs>

  <!-- soft backdrop blobs -->
  <circle cx="270" cy="190" r="185" fill="#ffffff" opacity="0.05" />
  <circle cx="110" cy="330" r="95" fill="#2dd4bf" opacity="0.08" />
  <circle cx="420" cy="80" r="60" fill="#5eead4" opacity="0.08" />

  <!-- scattered dots -->
  <circle cx="58" cy="76" r="5" fill="#ffffff" opacity="0.35" />
  <circle cx="140" cy="55" r="3" fill="#5eead4" opacity="0.55" />
  <circle cx="412" cy="245" r="4" fill="#5eead4" opacity="0.5" />
  <circle cx="382" cy="335" r="6" fill="#ffffff" opacity="0.25" />
  <circle cx="60" cy="230" r="3" fill="#ffffff" opacity="0.4" />

  <!-- open book -->
  <g transform="translate(240,232) rotate(-4)">
    <rect x="-140" y="-70" width="135" height="140" rx="10" fill="#ffffff" fill-opacity="0.97" />
    <rect x="5" y="-70" width="135" height="140" rx="10" fill="#ffffff" fill-opacity="0.97" />
    <rect x="-6" y="-70" width="12" height="140" fill="#0f766e" opacity="0.15" />

    <!-- text lines, left page -->
    <rect x="-124" y="-46" width="90" height="6" rx="3" fill="#0f766e" opacity="0.25" />
    <rect x="-124" y="-26" width="100" height="6" rx="3" fill="#0f766e" opacity="0.2" />
    <rect x="-124" y="34" width="80" height="6" rx="3" fill="#0f766e" opacity="0.2" />
    <rect x="-124" y="54" width="96" height="6" rx="3" fill="#0f766e" opacity="0.18" />

    <!-- text lines, right page -->
    <rect x="16" y="-46" width="96" height="6" rx="3" fill="#0f766e" opacity="0.25" />
    <rect x="16" y="34" width="70" height="6" rx="3" fill="#0f766e" opacity="0.2" />
    <rect x="16" y="54" width="90" height="6" rx="3" fill="#0f766e" opacity="0.18" />

    <!-- pulse line across the spread -->
    <polyline
      points="-150,-2 -90,-2 -70,-42 -48,32 -28,-2 38,-2 58,-38 80,28 102,-2 150,-2"
      fill="none"
      stroke="#2dd4bf"
      stroke-width="6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- medicine capsule -->
  <g transform="translate(372,92) rotate(35)">
    <g clip-path="url(#pillClip)">
      <rect x="-14" y="-40" width="28" height="80" fill="#ffffff" />
      <rect x="-14" y="-40" width="28" height="40" fill="#2dd4bf" />
    </g>
    <rect x="-14" y="-40" width="28" height="80" rx="14" fill="none" stroke="#0f766e" stroke-width="2" opacity="0.3" />
  </g>

  <!-- completion badge -->
  <g transform="translate(94,344)">
    <circle r="27" fill="#2dd4bf" />
    <path d="M -11,0 L -3,9 L 13,-10" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
